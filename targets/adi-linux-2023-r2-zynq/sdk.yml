# Kernel source/toolchain pins and validated caches are owned by the helper.
variables:
  KERNEL_OUTPUT: artifacts/zynq
  KERNEL_JOBS: "4"
copy_files:
  - source: ../adi-linux/build-kernel.py
    dest: scripts/build-kernel.py
    cache: false
build:
  - >-
    python3 scripts/build-kernel.py --platform zynq
    --output "${{ KERNEL_OUTPUT }}" --jobs "${{ KERNEL_JOBS }}"
